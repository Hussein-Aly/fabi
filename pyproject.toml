[project]
name = "mbai.aiserver"
version = "0.0.0.2" # does not matter
description = "..." # TODO: Add infos
authors = [
    {name = "Fabio Rutter", email = "fabio.rutter@fabasoft.com"},
    # TODO: Add infos

]
requires-python = ">=3.12" # change if anyone needs an older version (not tested)
dependencies=[
    "fastapi==0.135.1",
    "pydantic-settings==2.12.0",
    "uvicorn==0.42.0",
    "python-jose==3.5.0",
    "fastapi-swagger==0.4.41",
    "mbai-base==0.2.1.5",
    "json5==0.13.0",
    "pydantic-ai-slim[openai,mcp,ag-ui]",
    "openai",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-env==1.6.0",
    "flake8==7.3.0",
    "pytest-asyncio==1.3.0",
    "click==8.3.1",
    "locust==2.43.3",
    "polyfactory==3.3.0"
]

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
addopts = "--disable-warnings -q"
pythonpath = [
    "."
]


