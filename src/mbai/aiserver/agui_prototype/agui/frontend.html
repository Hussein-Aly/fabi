<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-UI + pydantic-ai example</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 20px;
            background: #1a1d27;
            border-bottom: 1px solid #2d3148;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        header span {
            font-size: 0.75rem;
            color: #6b7280;
        }

        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Chat panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .confirm_btn {
          padding: 8px 20px;
          background: #4f6ef7;
          border: none;
          border-radius: 8px;
          color: white;
          cursor: pointer;
          font-size: 0.9rem;
          font-weight: 500;
          margin-left: 6px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: #3b4fd8;
        }
         .msg.userinfo {
            align-self: flex-end;
            background: none;
            color: #73734d;
        }

        .msg.assistantinfo {
            align-self: flex-start;
            background: none;
            color: #73734d;
        }

        .msg.assistant {
            align-self: flex-start;
            background: #1e2235;
            border: 1px solid #2d3148;
        }

        .msg.assistant.streaming {
            border-color: #4f6ef7;
        }

        .input-row {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #1a1d27;
            border-top: 1px solid #2d3148;
        }

        #user-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #2d3148;
            background: #0f1117;
            color: #e2e8f0;
            font-size: 0.9rem;
            resize: none;
            height: 44px;
        }

        #user-input:focus {
            outline: none;
            border-color: #4f6ef7;
        }

        #send-btn {
            padding: 0 20px;
            background: #4f6ef7;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        #send-btn:disabled {
            background: #2d3148;
            cursor: not-allowed;
        }

        #upload-btn {
            padding: 0 14px;
            background: #2d3148;
            border: none;
            border-radius: 8px;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        #upload-btn:hover {
            background: #3b4260;
        }

        #upload-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── Tool call bubble ──────────────────────────────────────── */
        .tool-call-bubble {
            align-self: flex-start;
            max-width: 85%;
            border-radius: 10px;
            border: 1px solid #2a1e3d;
            background: linear-gradient(135deg, #1a1230 0%, #1e1635 100%);
            font-size: 0.82rem;
            line-height: 1.5;
            height: auto;
        }

        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(168, 85, 247, 0.08);
            border-bottom: 1px solid #2a1e3d;
            cursor: pointer;
            user-select: none;
        }

        .tool-call-header:hover {
            background: rgba(168, 85, 247, 0.14);
        }

        .tool-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            border-radius: 5px;
            background: rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: #c084fc;
        }

        .tool-name {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-weight: 600;
            color: #c084fc;
        }

        .tool-status {
            margin-left: auto;
            font-size: 0.7rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tool-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .tool-status .dot.done {
            background: #10b981;
        }

        .tool-chevron {
            color: #6b7280;
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .tool-call-bubble.expanded .tool-chevron {
            transform: rotate(90deg);
        }

        .tool-call-body {
            display: none;
            padding: 0;
        }

        .tool-call-bubble.expanded .tool-call-body {
            display: block;
        }

        .tool-section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6b7280;
            padding: 6px 12px 2px;
        }

        .tool-body-name {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            color: #d8b4fe;
            padding: 10px 12px 4px;
            border-bottom: 1px solid #2a1e3d;
            margin-bottom: 2px;
        }

        .tool-call-args {
            padding: 4px 12px 8px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.72rem;
            color: #94a3b8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .tool-call-result {
            padding: 4px 12px 8px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.72rem;
            color: #86efac;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #2a1e3d;
        }

        @keyframes tool-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .tool-call-bubble.streaming .dot {
            animation: tool-pulse 1.2s ease-in-out infinite;
        }

        /* History / Events panel */
        .side-panel {
            width: 380px;
            border-left: 1px solid #2d3148;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #2d3148;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 0.75rem;
            cursor: pointer;
            color: #6b7280;
        }

        .tab.active {
            color: #4f6ef7;
            border-bottom: 2px solid #4f6ef7;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 0.72rem;
            font-family: monospace;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .event-item {
            margin-bottom: 8px;
            border-left: 2px solid #2d3148;
            padding-left: 8px;
        }

        .event-type {
            color: #4f6ef7;
            font-weight: bold;
        }

        .event-type.run {
            color: #10b981;
        }

        .event-type.text {
            color: #f59e0b;
        }

        .event-type.tool {
            color: #ec4899;
        }

        .event-type.state {
            color: #06b6d4;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #94a3b8;
        }

        .msg-item {
            margin-bottom: 10px;
            border: 1px solid #2d3148;
            border-radius: 6px;
            padding: 8px;
        }

        .msg-role {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .msg-role.user {
            color: #60a5fa;
        }

        .msg-role.assistant {
            color: #34d399;
        }

        .msg-role.system {
            color: #a78bfa;
        }

        .msg-role.tool {
            color: #fb923c;
        }

        .msg-content {
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>

<header>
    <h1>AG-UI × pydantic-ai</h1>
    <span>history stored client-side with pydantic_ai->AGUI messages | whole message-history gets sent to client via custom-event</span>
</header>

<div class="layout">
    <!-- Chat -->
    <div class="chat-panel">
        <div id="messages"></div>
        <div class="input-row">
            <textarea id="user-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
            <input type="file" id="file-input" hidden>
            <button id="upload-btn" title="Upload file">+</button>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Side panel -->
    <div class="side-panel">
        <div class="tabs">
            <div class="tab active" data-tab="history">History JSON</div>
            <div class="tab" data-tab="events">SSE Events</div>
        </div>
        <div class="tab-content">
            <div id="tab-history" class="tab-pane active"></div>
            <div id="tab-events" class="tab-pane"></div>
        </div>
    </div>
</div>

<script>
    // ── State ────────────────────────────────────────────────────────────────────
    const AGENT_URL = "/agui_agent";

    // history is now ONLY updated by STATE_DELTA events from the server,
    // plus user messages appended locally before sending.
    let history = [];
    let threadId = generateUUID();
    let sseEvents = [];

    // Track in-flight tool calls: toolCallId → { bubble, args }
    let activeToolCalls = {};

    // ── UI helpers ───────────────────────────────────────────────────────────────
    const messagesEl = document.getElementById("messages");
    const userInputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const uploadBtn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("file-input");
    const historyEl = document.getElementById("tab-history");
    const eventsEl = document.getElementById("tab-events");

    function renderHistoryPanel() {
        historyEl.innerHTML = "<pre>" + JSON.stringify(history, null, 2) + "</pre>";
    }

    function appendEventPanel(event) {
        const div = document.createElement("div");
        div.className = "event-item";
        const typeClass = event.type?.startsWith("RUN") ? "run"
            : event.type?.startsWith("TEXT") ? "text"
                : event.type?.startsWith("TOOL") ? "tool"
                    : event.type?.startsWith("STATE") ? "state" : "";
        div.innerHTML = `<div class="event-type ${typeClass}">${event.type ?? "unknown"}</div>`
            + `<pre>${JSON.stringify(event, null, 2)}</pre>`;
        eventsEl.prepend(div);
    }

    function addChatBubble(role, content, id) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.dataset.msgId = id ?? "";
        div.textContent = content;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }
function addUserConfirmation(role, content, id) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.dataset.msgId = id ?? "";

    const text = document.createElement("span");
    text.textContent = content;
    div.appendChild(text);

    const btnContainer = document.createElement("div");
    btnContainer.style.marginTop = "8px";

    const confirmBtn = document.createElement("button");
    confirmBtn.classList.add("confirm_btn")
    confirmBtn.textContent = "Confirm";
    confirmBtn.addEventListener("click", () => {
        // handle confirm
        console.log("Confirmed:", id);
        let props = { [id]: true }
        addChatBubble("userinfo", `send 'tool-call=${id} confirmed' to agent`)
        sendMessage(true, props)
        confirmBtn.parentElement.style.display = "none"
    });

    const rejectBtn = document.createElement("button");
    rejectBtn.classList.add("confirm_btn")
    rejectBtn.textContent = "Reject";
    rejectBtn.addEventListener("click", () => {
        // handle reject
        console.log("Rejected:", id);
        let props = { [id]: false }
        addChatBubble("userinfo", `send 'tool-call=${id} denied' to agent`)
        sendMessage(true, props)
        confirmBtn.parentElement.style.display = "none"
    });

    btnContainer.appendChild(confirmBtn);
    btnContainer.appendChild(rejectBtn);
    div.appendChild(btnContainer);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
}


function addSuggestButton(name, data) {
    const div = document.createElement("div");
    div.style.cssText = "margin: 8px 0;";

    const btn = document.createElement("button");
    btn.textContent = `📋 ${name}`;
    btn.style.cssText = `
        padding: 10px 20px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
    `;
    btn.onmouseenter = () => btn.style.background = "#4338ca";
    btn.onmouseleave = () => btn.style.background = "#4f46e5";

    btn.onclick = () => {
        // Remove existing popup if any
        document.querySelector(".action-popup-overlay")?.remove();

        const overlay = document.createElement("div");
        overlay.className = "action-popup-overlay";
        overlay.style.cssText = `
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        `;
        overlay.onclick = (e) => {
            if (e.target === overlay) overlay.remove();
        };

        const popup = document.createElement("div");
        popup.style.cssText = `
            background: white; border-radius: 12px;
            padding: 24px; min-width: 360px; max-width: 500px;
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        `;

        const title = document.createElement("h3");
        title.textContent = name;
        title.style.cssText = "margin: 0 0 16px 0; font-size: 18px; color: #1e1b4b;";

        const fields = document.createElement("div");
        Object.entries(data).forEach(([key, value]) => {
            const row = document.createElement("div");
            row.style.cssText = "margin-bottom: 12px;";

            const label = document.createElement("label");
            label.textContent = key.replace(/_/g, " ");
            label.style.cssText = `
                display: block; font-size: 12px; font-weight: 600;
                color: #6b7280; text-transform: uppercase;
                margin-bottom: 4px; letter-spacing: 0.05em;
            `;

            const input = document.createElement("input");
            input.name = key;
            input.value = value ?? "";
            input.style.cssText = `
                width: 100%; padding: 8px 12px;
                border: 1px solid #d1d5db; border-radius: 6px;
                font-size: 14px; box-sizing: border-box;
            `;
            input.onfocus = () => input.style.borderColor = "#4f46e5";
            input.onblur = () => input.style.borderColor = "#d1d5db";

            row.appendChild(label);
            row.appendChild(input);
            fields.appendChild(row);
        });

        const actions = document.createElement("div");
        actions.style.cssText = "display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;";

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel";
        cancelBtn.style.cssText = `
            padding: 8px 16px; border: 1px solid #d1d5db;
            border-radius: 6px; background: white;
            cursor: pointer; font-size: 14px; color: #374151;
        `;
        cancelBtn.onclick = () => overlay.remove();

        const submitBtn = document.createElement("button");
        submitBtn.textContent = "Confirm";
        submitBtn.style.cssText = `
            padding: 8px 16px; border: none;
            border-radius: 6px; background: #4f46e5;
            color: white; cursor: pointer; font-size: 14px; font-weight: 500;
        `;
        submitBtn.onclick = () => {
            const formData = {};
            fields.querySelectorAll("input").forEach(inp => {
                formData[inp.name] = inp.value;
            });
            console.log("Submitted:", formData);
            console.log("add to history")
            console.log(history)
            history.push({
                id:generateUUID(),
                role: "user",
                content: JSON.stringify(formData),
            })
            console.log(history)
            renderHistoryPanel();

            addChatBubble("userinfo","AUTOMATIC MSG: user confirmed the form")
            // TODO: fetch(ACTION_ENDPOINTS[data.action], { method: "POST", body: JSON.stringify(formData) })
            overlay.remove();
        };

        actions.appendChild(cancelBtn);
        actions.appendChild(submitBtn);
        popup.appendChild(title);
        popup.appendChild(fields);
        popup.appendChild(actions);
        overlay.appendChild(popup);
        document.body.appendChild(overlay);
    };

    div.appendChild(btn);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
}

    function prettyJson(str) {
        try {
            return JSON.stringify(JSON.parse(str), null, 2);
        } catch {
            return str;
        }
    }

    // ── Normalize event field names ──────────────────────────────────────────────
    function normalizeEvent(event) {
        const e = {...event};
        if (e.type && !e.type.includes("_")) {
            e.type = e.type.replace(/([a-z])([A-Z])/g, '$1_$2').toUpperCase();
        } else if (e.type) {
            e.type = e.type.toUpperCase();
        }

        if (e.tool_call_id === undefined && e.toolCallId !== undefined) e.tool_call_id = e.toolCallId;
        if (e.toolCallId === undefined && e.tool_call_id !== undefined) e.toolCallId = e.tool_call_id;

        if (e.tool_call_name === undefined && e.toolCallName !== undefined) e.tool_call_name = e.toolCallName;
        if (e.toolCallName === undefined && e.tool_call_name !== undefined) e.toolCallName = e.tool_call_name;

        if (e.message_id === undefined && e.messageId !== undefined) e.message_id = e.messageId;
        if (e.messageId === undefined && e.message_id !== undefined) e.messageId = e.message_id;

        return e;
    }

    // ── Apply a JSON Patch (RFC 6902) operation to an object ─────────────────────
    // STATE_DELTA events carry a `delta` array of JSON Patch operations.
    function applyJsonPatch(target, patch) {
        if (!Array.isArray(patch)) return target;

        for (const op of patch) {
            const path = op.path;
            const segments = path.split("/").filter(s => s !== "");

            switch (op.op) {
                case "replace": {
                    setNestedValue(target, segments, op.value);
                    break;
                }
                case "add": {
                    const parent = getNestedValue(target, segments.slice(0, -1));
                    const lastSeg = segments[segments.length - 1];
                    if (Array.isArray(parent)) {
                        if (lastSeg === "-") {
                            parent.push(op.value);
                        } else {
                            parent.splice(parseInt(lastSeg, 10), 0, op.value);
                        }
                    } else if (parent && typeof parent === "object") {
                        parent[lastSeg] = op.value;
                    }
                    break;
                }
                case "remove": {
                    const parentRm = getNestedValue(target, segments.slice(0, -1));
                    const lastSegRm = segments[segments.length - 1];
                    if (Array.isArray(parentRm)) {
                        parentRm.splice(parseInt(lastSegRm, 10), 1);
                    } else if (parentRm && typeof parentRm === "object") {
                        delete parentRm[lastSegRm];
                    }
                    break;
                }
                default:
                    console.warn("Unsupported JSON Patch op:", op.op);
            }
        }
        return target;
    }

    function getNestedValue(obj, segments) {
        let current = obj;
        for (const seg of segments) {
            if (current == null) return undefined;
            if (Array.isArray(current)) {
                current = current[parseInt(seg, 10)];
            } else {
                current = current[seg];
            }
        }
        return current;
    }

    function setNestedValue(obj, segments, value) {
        if (segments.length === 0) return;
        const parent = getNestedValue(obj, segments.slice(0, -1));
        const lastSeg = segments[segments.length - 1];
        if (Array.isArray(parent)) {
            parent[parseInt(lastSeg, 10)] = value;
        } else if (parent && typeof parent === "object") {
            parent[lastSeg] = value;
        }
    }

    // ── Tool call bubble ─────────────────────────────────────────────────────────
    function addToolCallBubble(toolCallId, toolName) {
        const bubble = document.createElement("div");
        bubble.className = "tool-call-bubble streaming";
        bubble.dataset.toolCallId = toolCallId;
        bubble.innerHTML = `
    <div class="tool-call-header" onclick="this.parentElement.classList.toggle('expanded')">
      <div class="tool-icon">⚙</div>
      <div class="tool-name">${escapeHtml(toolName)}</div>
      <div class="tool-status"><div class="dot"></div> running</div>
      <div class="tool-chevron">▶</div>
    </div>
    <div class="tool-call-body">
      <div class="tool-body-name">${escapeHtml(toolName)}</div>
      <div class="tool-section-label">Arguments</div>
      <div class="tool-call-args"></div>
    </div>
  `;
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    function markToolCallDone(tc) {
        console.log("markToolCallDone ")
        if (!tc || tc._done) return;
        tc._done = true;
        tc.bubble.classList.remove("streaming");
        const statusEl = tc.bubble.querySelector(".tool-status");
        statusEl.innerHTML = '<div class="dot done"></div> done';
    }

    function addToolCallResult(tc, resultContent) {
        if (!tc) return;
        const body = tc.bubble.querySelector(".tool-call-body");
        if (!body.querySelector(".tool-call-result")) {
            const labelEl = document.createElement("div");
            labelEl.className = "tool-section-label";
            labelEl.textContent = "Result";
            body.appendChild(labelEl);

            const resultEl = document.createElement("div");
            resultEl.className = "tool-call-result";
            resultEl.textContent = prettyJson(resultContent);
            body.appendChild(resultEl);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    // ── Tab switching ─────────────────────────────────────────────────────────────
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
        });
    });

    // ── Shared agent state managed by STATE_DELTA / STATE_SNAPSHOT ────────────
    // The server owns the canonical state (including messages/history).
    // We keep a local mirror that is updated exclusively by state events.
    let agentState = { messages: [] };
    let forwardedProps = {toolApprovals:{}}

    function processEvent(event, uiState) {
        appendEventPanel(event);

        switch (event.type) {
            // ── State synchronisation (the ONLY source of truth for history) ──
            case "STATE_SNAPSHOT": {
                // Full replacement of agent state
                agentState = event.snapshot ?? event.state ?? {};
                // Sync history from agent state
                if (Array.isArray(agentState.messages)) {
                    history = agentState.messages;
                }
                renderHistoryPanel();
                break;
            }

            case "CUSTOM": {
                if (event.name === "all_messages") {
                    // Incremental JSON Patch update
                    const all_messages = event.value

                    history = all_messages
                    renderHistoryPanel();
                }
                if (event.name === "info") {
                    addChatBubble("assistantinfo",event.value)
                }
                break;
            }

            // ── Text message events (UI only) ─────────────────────────
            case "TEXT_MESSAGE_START":
                uiState.assistantMsgId =
                    event.messageId ?? event.message_id ?? uiState.assistantMsgId;
                uiState.assistantBubble = addChatBubble("assistant", "", uiState.assistantMsgId);
                uiState.assistantBubble.classList.add("streaming");
                break;

            case "TEXT_MESSAGE_CONTENT":
                if (uiState.assistantBubble) {
                    uiState.assistantText += event.delta ?? "";
                    uiState.assistantBubble.textContent = uiState.assistantText;
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }
                break;

            case "TEXT_MESSAGE_END":
                if (uiState.assistantBubble) {
                    uiState.assistantBubble.classList.remove("streaming");
                }
                break;

            // ── Tool call events (UI only) ────────────────────────────
            case "TOOL_CALL_START": {
                const tcId =
                    event.toolCallId ?? event.tool_call_id ?? generateUUID();
                const name =
                    event.toolCallName ?? event.tool_call_name ?? event.name ?? "tool";
                const bubble = addToolCallBubble(tcId, name);
                activeToolCalls[tcId] = { bubble, args: "", name, _done: false, _result: undefined };
                break;
            }

            case "TOOL_CALL_ARGS": {
                const tcId = event.toolCallId ?? event.tool_call_id;
                const tc = activeToolCalls[tcId];
                if (tc) {
                    tc.args += event.delta ?? "";
                    const argsEl = tc.bubble.querySelector(".tool-call-args");
                    argsEl.textContent = prettyJson(tc.args);
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }
                break;
            }

            case "TOOL_CALL_END": {
                const tcId = event.toolCallId ?? event.tool_call_id;
                const tc = activeToolCalls[tcId];

                break;
            }

            case "TOOL_CALL_RESULT": {
                const tcId = event.toolCallId ?? event.tool_call_id;
                const tc = activeToolCalls[tcId];

                console.log("TOOL_CALL_RESULT")
                if (tc) {
                    markToolCallDone(tc);
                    const resultContent = event.result ?? event.content ?? "";
                    tc._result = resultContent;
                    addToolCallResult(tc, resultContent);
                }
                try {
                    const content = JSON.parse(event.content)
                    if (content.type === "action_card") {
                        addSuggestButton(content.action, content.params)
                    }
                    if (content.type === "suggest-ai-app") {
                        addSuggestButton(content.params.appName, content.params.appParams)
                    }

                } catch {
                    console.log("event.content not json")
                    console.log(event)
                }
                break;
            }

            // ── Run lifecycle ──────────────────────────────────────────
            case "RUN_STARTED":
                break;

            case "RUN_ERROR":
                for (const tcId of Object.keys(activeToolCalls)) {
                    markToolCallDone(activeToolCalls[tcId]);
                }
                addChatBubble(
                    "assistant",
                    "Error: " + (event.message ?? event.error ?? "Unknown error")
                );
                activeToolCalls = {};
                break;


            case "RUN_FINISHED": {
                // Clean up UI state — history is NOT touched here,
                // it was already updated by STATE_DELTA / STATE_SNAPSHOT events.

                console.log(activeToolCalls)

                for (const tcId of Object.keys(activeToolCalls)) {
                    if (!activeToolCalls[tcId]._done) {
                        console.log("render confirm button",tcId)
                        addUserConfirmation("assistent","do you want to do this? (hardcoded msg)",tcId)
                    }
                }
                if (uiState.assistantBubble) {
                    uiState.assistantBubble.classList.remove("streaming");
                }
                uiState.assistantText = "";
                uiState.assistantBubble = null;
                activeToolCalls = {};
                renderHistoryPanel();
                break;
            }

            default:
                console.log("Unhandled AG-UI event type:", event.type, event);
                break;
        }
    }

    // ── Parse SSE frames from a text buffer ───────────────────────────────────────
    function parseSSEBuffer(buffer) {
        const events = [];
        const frames = buffer.split("\n\n");
        const remaining = frames.pop();

        for (const frame of frames) {
            if (!frame.trim()) continue;
            const lines = frame.split("\n");
            let dataStr = "";
            for (const line of lines) {
                if (line.startsWith("data:")) {
                    dataStr += line.slice(5).trim();
                } else if (line.startsWith("data: ")) {
                    dataStr += line.slice(6);
                }
            }
            if (!dataStr) continue;
            try {
                const parsed = JSON.parse(dataStr);
                events.push(normalizeEvent(parsed));
            } catch (e) {
                console.warn("Failed to parse SSE data:", dataStr, e);
            }
        }

        return {events, remaining};
    }

    function generateUUID() {
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
            (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }

    // ── File upload ───────────────────────────────────────────────────────────────
    uploadBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;

        uploadBtn.disabled = true;
        uploadBtn.textContent = "⏳";

        try {
            const formData = new FormData();
            formData.append("file", file);

            const resp = await fetch("/upload", {
                method: "POST",
                body: formData,
            });

            if (!resp.ok) {
                const errText = await resp.text();
                addChatBubble("assistant", `Upload error ${resp.status}: ${errText}`);
                return;
            }

            const jsonResult = await resp.json();

            // Add as a user message to chat and history, but do NOT send to agent
            const content = "The user uploaded this file: \n" + JSON.stringify(jsonResult);
            const userMsg = { id: generateUUID(), role: "user", content: content };
            history.push(userMsg);
            addChatBubble("user", content, userMsg.id);
            renderHistoryPanel();

        } catch (err) {
            addChatBubble("assistant", "Upload failed: " + err.message);
            console.error(err);
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = "+";
            fileInput.value = "";  // reset so the same file can be re-selected
        }
    });

    // ── Sending a message ─────────────────────────────────────────────────────────
    async function sendMessage(tool_call_confirm = false, tool_approvals = {}) {
        let forwardedProps = {}
        if (tool_call_confirm)
        {
            console.log("sendMessage with tool_call_confirm")
            forwardedProps = {toolApprovals:tool_approvals}
        }
        else
        {
            const text = userInputEl.value.trim();
            userInputEl.value = "";
            sendBtn.disabled = true;

            // Add user message to local history for display and to send to server.
            // The server's STATE_DELTA will be the authoritative update.
            const userMsg = {id: generateUUID(), role: "user", content: text};
            history.push(userMsg);
            addChatBubble("user", text, userMsg.id);
            renderHistoryPanel();
        }


        const runAgentInput = {
            threadId: threadId,
            runId: generateUUID(),
            messages: history,
            state: agentState,
            tools: [],
            context: [],
            forwardedProps: forwardedProps,
            asdf:"asdf"
        };

        const uiState = {
            assistantMsgId: generateUUID(),
            assistantBubble: null,
            assistantText: "",
        };
        activeToolCalls = {};

        try {
            const resp = await fetch(AGENT_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json", "Accept": "text/event-stream"},
                body: JSON.stringify(runAgentInput),
            });

            if (!resp.ok) {
                const errText = await resp.text();
                addChatBubble("assistant", `Error ${resp.status}: ${errText}`);
                return;
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});

                const result = parseSSEBuffer(buffer);
                buffer = result.remaining;

                for (const event of result.events) {
                    processEvent(event, uiState);
                }
            }

            // Process any remaining data in the buffer
            if (buffer.trim()) {
                const lines = buffer.split("\n");
                let dataStr = "";
                for (const line of lines) {
                    if (line.startsWith("data:")) {
                        dataStr += line.slice(5).trim();
                    }
                }
                if (dataStr) {
                    try {
                        const event = normalizeEvent(JSON.parse(dataStr));
                        processEvent(event, uiState);
                    } catch (e) {
                        console.warn("Failed to parse final SSE buffer:", dataStr, e);
                    }
                }
            }

            // Safety net: clean up UI if stream ended without RUN_FINISHED
            for (const tcId of Object.keys(activeToolCalls)) {
                markToolCallDone(activeToolCalls[tcId]);
            }
            if (uiState.assistantBubble) {
                uiState.assistantBubble.classList.remove("streaming");
            }

        } catch (err) {
            addChatBubble("assistant", "Error: " + err.message);
            console.error(err);
            for (const tcId of Object.keys(activeToolCalls)) {
                markToolCallDone(activeToolCalls[tcId]);
            }
        } finally {
            sendBtn.disabled = false;
            userInputEl.focus();
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInputEl.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ── Initial state ─────────────────────────────────────────────────────────────
    renderHistoryPanel();
    userInputEl.focus();
</script>
</body>
